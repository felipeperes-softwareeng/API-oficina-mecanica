{% extends "base.html" %}

{% block titulo %}{{ 'Editar' if editando else 'Novo' }} cliente - Oficina Mecânica{% endblock %}

{% block conteudo %}
    <h1>{{ 'Editar cliente' if editando else 'Novo cliente' }}</h1>

    <form method="post" class="formulario">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" value="{{ dados.nome }}" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" value="{{ dados.cpf }}">

        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" value="{{ dados.telefone }}">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ dados.email }}">

        <div class="acoes">
            <button type="submit" class="btn btn-primario">Salvar</button>
            <a class="btn btn-secundario" href="{{ url_for('lista_clientes') }}">Cancelar</a>
        </div>
    </form>
{% endblock %}
