{% extends "base.html" %}

{% block titulo %}{{ 'Editar' if editando else 'Novo' }} veículo - Oficina Mecânica{% endblock %}

{% block conteudo %}
    <h1>{{ 'Editar veículo' if editando else 'Novo veículo' }}</h1>

    <form method="post" class="formulario">
        <label for="cliente_id">Dono (cliente) *</label>
        <select id="cliente_id" name="cliente_id" required>
            <option value="">Selecione...</option>
            {% for c in clientes %}
            <option value="{{ c.id }}" {% if c.id|string == dados.cliente_id|string %}selected{% endif %}>{{ c.nome }}</option>
            {% endfor %}
        </select>

        <label for="placa">Placa *</label>
        <input type="text" id="placa" name="placa" value="{{ dados.placa }}" maxlength="8" required>

        <label for="modelo">Modelo *</label>
        <input type="text" id="modelo" name="modelo" value="{{ dados.modelo }}" required>

        <label for="marca">Marca *</label>
        <input type="text" id="marca" name="marca" value="{{ dados.marca }}" required>

        <label for="ano">Ano</label>
        <input type="number" id="ano" name="ano" value="{{ dados.ano }}" min="1900">

        <div class="acoes">
            <button type="submit" class="btn btn-primario">Salvar</button>
            <a class="btn btn-secundario" href="{{ url_for('lista_veiculos') }}">Cancelar</a>
        </div>
    </form>
{% endblock %}
